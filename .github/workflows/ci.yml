name: C17 CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev
      - name: Build
        run: make clean all
      - name: Unit tests
        run: make test
      - name: Equivalence tests
        run: make equivalence-test
